<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Configurações • Central OS</title><link rel="stylesheet" href="/styles.css"></head><body data-page="configuracoes"><div class="shell"><aside class="sidebar" data-autonav></aside><main class="main content-page"><header class="topbar"><div><span class="eyebrow">Configuração local</span><h1>Configurações</h1><p>Resumo sem segredos da integração.</p></div></header><section class="panel"><div id="configCards" class="cards"><div class="empty">Carregando…</div></div></section></main></div><script src="/ui.js"></script><script type="module">import{localApiFetch}from'/local-api.js';const d=await localApiFetch('/api/relatorio/config').catch(e=>({error:e.message}));document.getElementById('configCards').innerHTML=d.error?`<div class="empty">${d.error}</div>`:`<article class="card"><h3>Origem</h3><p>${d.origem?.name||d.origem?.id||'Não configurado'}</p></article><article class="card"><h3>Destino</h3><p>${d.destino?.name||d.destino?.id||'Não configurado'}</p></article><article class="card"><h3>Usuários registrados</h3><p>${d.registeredUsers||0}</p></article><article class="card"><h3>Execução via painel</h3><p>${d.webExecutionEnabled?'Habilitada':'Desabilitada'}</p></article>`;</script></body></html>
